[project]
name = "trees-replication"
version = "1.0.0"
description = "Code and demo data for 'Natural capital restoration and household wealth in sub-Saharan Africa' (Rizzi, Xu, Heal)"
readme = "README.md"
requires-python = ">=3.11"
# Versions are those the package was tested with (uv.lock pins the full tree).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
